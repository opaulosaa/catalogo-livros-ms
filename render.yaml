services:
  # 1. Frontend
  - type: web
    name: livraria-frontend
    env: docker
    dockerContext: ./frontend # CORREÇÃO: Mudou de 'context' para 'dockerContext'
    dockerfilePath: ./frontend/Dockerfile
    plan: free
    envVars:
      - key: VITE_API_USERS
        fromService: # CORREÇÃO: Agora é um objeto estruturado
          type: web
          name: ms-usuarios
          property: url
      - key: VITE_API_CATALOG
        fromService:
          type: web
          name: ms-catalogo
          property: url
      - key: VITE_API_PAYMENT
        fromService:
          type: web
          name: ms-pagamento
          property: url
      - key: VITE_API_NOTIFICATION
        fromService:
          type: web
          name: ms-notificacao
          property: url

  # 2. Usuários
  - type: web
    name: ms-usuarios
    env: docker
    dockerContext: ./microservicos/user_microsservice/usuarios # CORREÇÃO: 'dockerContext'
    dockerfilePath: ./microservicos/user_microsservice/usuarios/Dockerfile
    plan: free
    envVars:
      - key: SERVER_PORT
        value: "8080"
      # Lembre-se de configurar as variáveis de Banco de Dados via "Environment Groups" no painel

  # 3. Catálogo
  - type: web
    name: ms-catalogo
    env: docker
    dockerContext: ./microservicos/catalogo_livros # CORREÇÃO: 'dockerContext'
    dockerfilePath: ./microservicos/catalogo_livros/Dockerfile
    plan: free
    envVars:
      - key: SERVER_PORT
        value: "8080"
      - key: USUARIOS_HOST
        fromService:
          type: web
          name: ms-usuarios
          property: url
      - key: PAGAMENTO_HOST
        fromService:
          type: web
          name: ms-pagamento
          property: url

  # 4. Pagamento
  - type: web
    name: ms-pagamento
    env: docker
    dockerContext: ./microservicos/spring.boot.ms.pagamento # CORREÇÃO: 'dockerContext'
    dockerfilePath: ./microservicos/spring.boot.ms.pagamento/Dockerfile
    plan: free
    envVars:
      - key: SERVER_PORT
        value: "8080"
      - key: NOTIFICACAO_HOST
        fromService:
          type: web
          name: ms-notificacao
          property: url

  # 5. Notificação
  - type: web
    name: ms-notificacao
    env: docker
    dockerContext: ./microservicos/AV3_catalogolivro_notification # CORREÇÃO: 'dockerContext'
    dockerfilePath: ./microservicos/AV3_catalogolivro_notification/Dockerfile
    plan: free
    envVars:
      - key: SERVER_PORT
        value: "8080"
      - key: USUARIOS_HOST
        fromService:
          type: web
          name: ms-usuarios
          property: url
